<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/hip/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HiP</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <script type="module" crossorigin src="/hip/assets/index-BLmcGMHS.js"></script>
    <link rel="stylesheet" crossorigin href="/hip/assets/index-B_XMxQYt.css">
  </head>

  </body>
</html>
